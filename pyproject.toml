[project]
name = "millie-recommendation-system"
version = "0.1.0"
description = "Production-oriented personalized carousel recommendation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
ml = [
  "lightgbm>=4.6,<5",
  "numpy>=2.1,<3",
  "torch>=2.6,<3",
]

[project.scripts]
millie-api = "recommendation_service.main:run"
millie-train = "recommendation_service.training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
